name: Public project agent task

on:
  repository_dispatch:
    types: [agent_public_task]

# The private Task Manager runner owns the Codex login. Share its queue with
# Task Manager agent jobs rather than registering that runner on public repos.
concurrency:
  group: agent-task-manager
  cancel-in-progress: false

jobs:
  implement:
    runs-on: [self-hosted, linux, x64, codex-agent]
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TASK_JSON: ${{ toJSON(github.event.client_payload) }}
    steps:
      - name: Check out the trusted control repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate public task and keep trusted scripts outside target checkout
        run: |
          set -euo pipefail
          python3 scripts/public_agent_task.py prepare
          cp scripts/public_agent_task.py scripts/agent_task.py scripts/agent_images.py "$RUNNER_TEMP/"

      - name: Check out approved public repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repo_full_name }}
          ref: ${{ github.event.client_payload.base_branch }}
          path: target
          persist-credentials: false
          fetch-depth: 0

      - name: Create isolated branch from the checked-out commit
        working-directory: target
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/agent-base-sha.txt"
          git switch -c "$AGENT_BRANCH" HEAD

      - name: Report agent start
        id: start
        env:
          AGENT_CALLBACK_TOKEN: ${{ secrets.AGENT_CALLBACK_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$AGENT_CALLBACK_TOKEN"
          python3 "$RUNNER_TEMP/agent_task.py" started

      - name: Download task images
        if: steps.start.outputs.cancelled != 'true'
        env:
          AGENT_CALLBACK_TOKEN: ${{ secrets.AGENT_CALLBACK_TOKEN }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/agent_images.py" download

      - name: Implement with Codex in the public checkout
        if: steps.start.outputs.cancelled != 'true'
        working-directory: target
        run: |
          set -euo pipefail
          IMAGE_ARGS=()
          while IFS= read -r image_path; do
            [[ -z "$image_path" ]] || IMAGE_ARGS+=(--image "$image_path")
          done < "$RUNNER_TEMP/agent-image-paths.txt"
          codex exec --sandbox workspace-write -c approval_policy=never \
            --model gpt-6-sol --ephemeral --json "${IMAGE_ARGS[@]}" \
            --output-last-message "$RUNNER_TEMP/agent-result.txt" \
            - < "$RUNNER_TEMP/agent-prompt.txt" \
            > "$RUNNER_TEMP/agent-events.jsonl"

      - name: Validate public patch using trusted policy
        if: steps.start.outputs.cancelled != 'true'
        working-directory: target
        run: |
          set -euo pipefail
          PYTHONPATH="$RUNNER_TEMP" python3 "$RUNNER_TEMP/public_agent_task.py" check-diff
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/agent.patch"

      - uses: actions/upload-artifact@v4
        if: steps.start.outputs.cancelled != 'true'
        with:
          name: public-agent-patch
          path: |
            ${{ runner.temp }}/agent.patch
            ${{ runner.temp }}/agent-base-sha.txt
            ${{ runner.temp }}/agent-result.txt
            ${{ runner.temp }}/agent-events.jsonl
          if-no-files-found: error
          retention-days: 1

      - name: Report failed implementation
        if: failure()
        env:
          AGENT_CALLBACK_TOKEN: ${{ secrets.AGENT_CALLBACK_TOKEN }}
          JOB_STATUS: failure
          FAILURE_PHASE: implement
          PR_URL: ''
          HEAD_SHA: ''
        run: |
          set -euo pipefail
          python3 scripts/agent_task.py callback

      - name: Remove temporary images
        if: always()
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/agent-images"
          rm -f -- "$RUNNER_TEMP/agent-image-paths.txt"

  publish:
    needs: implement
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      TASK_JSON: ${{ toJSON(github.event.client_payload) }}
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: public-agent-patch
          path: ${{ runner.temp }}

      - name: Validate target and prepare PR metadata
        run: |
          set -euo pipefail
          python3 scripts/public_agent_task.py prepare
          cp scripts/public_agent_task.py scripts/agent_task.py "$RUNNER_TEMP/"

      - name: Check out the same approved public repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repo_full_name }}
          ref: ${{ github.event.client_payload.base_branch }}
          path: target
          persist-credentials: false
          fetch-depth: 0

      - name: Apply and revalidate patch at the exact agent base
        working-directory: target
        run: |
          set -euo pipefail
          base_sha=$(cat "$RUNNER_TEMP/agent-base-sha.txt")
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$base_sha^{commit}"
          git switch -c "$AGENT_BRANCH" "$base_sha"
          git apply --index "$RUNNER_TEMP/agent.patch"
          PYTHONPATH="$RUNNER_TEMP" python3 "$RUNNER_TEMP/public_agent_task.py" check-diff

      - name: Push branch using a token unavailable to Codex
        id: branch
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.AGENT_PUBLIC_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git -c core.hooksPath=/dev/null \
              -c user.name='Business AI Codex' \
              -c user.email='codex@users.noreply.github.com' \
              commit -m "feat(agent): work on task $AGENT_TASK_ID" \
                     -m "Agent-Run-ID: $AGENT_RUN_ID"
          git -c core.hooksPath=/dev/null push origin "HEAD:$AGENT_BRANCH"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open PR in the target repository
        id: pr
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.AGENT_PUBLIC_REPO_TOKEN }}
        run: |
          set -euo pipefail
          pr_url=$(gh pr create --repo "$AGENT_REPO" \
            --base "$AGENT_BASE" --head "$AGENT_BRANCH" \
            --title "Task #$AGENT_TASK_ID: Codex change" \
            --body-file "$RUNNER_TEMP/agent-pr-body.md")
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Report PR or failure to Task Manager
        if: always()
        env:
          AGENT_CALLBACK_TOKEN: ${{ secrets.AGENT_CALLBACK_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          FAILURE_PHASE: publish
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          HEAD_SHA: ${{ steps.branch.outputs.head_sha }}
        run: |
          set -euo pipefail
          test -n "$AGENT_CALLBACK_TOKEN"
          python3 scripts/agent_task.py callback
