name: Agent task

on:
  repository_dispatch:
    types: [agent_task]

# One private runner owns the ChatGPT auth file. Never use it concurrently.
concurrency:
  group: agent-task-manager
  cancel-in-progress: false

jobs:
  implement:
    runs-on: [self-hosted, linux, x64, codex-agent]
    timeout-minutes: 30
    outputs:
      branch_exists: ${{ steps.guard.outputs.exists }}
    permissions:
      contents: read
    env:
      TASK_JSON: ${{ toJSON(github.event.client_payload) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare task
        run: |
          set -euo pipefail
          python3 scripts/agent_task.py prepare

      - name: Create branch
        run: |
          set -euo pipefail
          git switch -c "$AGENT_BRANCH" "$GITHUB_SHA"

      - name: Check for an existing run branch
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$AGENT_BRANCH" --jq .ref >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Report agent start
        id: start
        if: steps.guard.outputs.exists != 'true'
        env:
          AGENT_CALLBACK_TOKEN: ${{ secrets.AGENT_CALLBACK_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$AGENT_CALLBACK_TOKEN"
          python3 scripts/agent_task.py started

      - name: Download task images
        if: steps.guard.outputs.exists != 'true' && steps.start.outputs.cancelled != 'true'
        env:
          AGENT_CALLBACK_TOKEN: ${{ secrets.AGENT_CALLBACK_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/agent_images.py download

      - name: Implement with Codex
        id: codex
        if: steps.guard.outputs.exists != 'true' && steps.start.outputs.cancelled != 'true'
        run: |
          set -euo pipefail
          IMAGE_ARGS=()
          while IFS= read -r image_path; do
            [[ -z "$image_path" ]] || IMAGE_ARGS+=(--image "$image_path")
          done < "$RUNNER_TEMP/agent-image-paths.txt"
          codex exec --sandbox workspace-write -c approval_policy=never \
            -c model_reasoning_effort=medium \
            --model gpt-6-sol --ephemeral --json "${IMAGE_ARGS[@]}" \
            --output-last-message "$RUNNER_TEMP/agent-result.txt" \
            - < "$RUNNER_TEMP/agent-prompt.txt" \
            > "$RUNNER_TEMP/agent-events.jsonl"

      - name: Check changed paths
        if: steps.guard.outputs.exists != 'true' && steps.start.outputs.cancelled != 'true'
        run: |
          set -euo pipefail
          # Take the validator from the trusted dispatch commit. The agent may
          # edit files in the checkout, including its copy of this script.
          git show "$GITHUB_SHA:scripts/agent_task.py" > "$RUNNER_TEMP/agent-validator.py"
          python3 "$RUNNER_TEMP/agent-validator.py" check-diff

      - name: Package reviewed file changes
        if: steps.guard.outputs.exists != 'true' && steps.start.outputs.cancelled != 'true'
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/agent.patch"

      - uses: actions/upload-artifact@v4
        if: steps.guard.outputs.exists != 'true' && steps.start.outputs.cancelled != 'true'
        with:
          name: agent-patch
          path: |
            ${{ runner.temp }}/agent.patch
            ${{ runner.temp }}/agent-result.txt
            ${{ runner.temp }}/agent-events.jsonl
          if-no-files-found: error
          retention-days: 1

      - name: Report failed implementation
        if: failure() && steps.start.outcome == 'success' && steps.guard.outputs.exists != 'true'
        env:
          AGENT_CALLBACK_TOKEN: ${{ secrets.AGENT_CALLBACK_TOKEN }}
          JOB_STATUS: failure
          FAILURE_PHASE: implement
          CODEX_STEP_OUTCOME: ${{ steps.codex.outcome }}
          PR_URL: ''
          HEAD_SHA: ''
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:scripts/agent_task.py" > "$RUNNER_TEMP/agent-validator.py"
          python3 "$RUNNER_TEMP/agent-validator.py" callback

      - name: Remove temporary task images
        if: always()
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/agent-images"
          rm -f -- "$RUNNER_TEMP/agent-image-paths.txt"

  publish:
    needs: implement
    if: needs.implement.outputs.branch_exists != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      TASK_JSON: ${{ toJSON(github.event.client_payload) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: agent-patch
          path: ${{ runner.temp }}

      - name: Prepare publication metadata
        run: python3 scripts/agent_task.py prepare

      - name: Apply patch in a clean publication checkout
        run: |
          set -euo pipefail
          git switch -c "$AGENT_BRANCH" "$GITHUB_SHA"
          git apply --index "$RUNNER_TEMP/agent.patch"
          git show "$GITHUB_SHA:scripts/agent_task.py" > "$RUNNER_TEMP/agent-validator.py"
          python3 "$RUNNER_TEMP/agent-validator.py" check-diff

      - name: Commit and push isolated branch
        id: branch
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git -c core.hooksPath=/dev/null \
              -c user.name='Business AI Codex' \
              -c user.email='codex@users.noreply.github.com' \
              commit -m "feat(agent): work on task $AGENT_TASK_ID" \
                     -m "Agent-Run-ID: $AGENT_RUN_ID"
          git -c core.hooksPath=/dev/null push origin "HEAD:$AGENT_BRANCH"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: >-
          (env.AGENT_MODE != 'fast' || env.FAST_FALLBACK == 'true')
        id: pr
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          pr_url=$(gh pr create \
            --base "$AGENT_BASE" --head "$AGENT_BRANCH" \
            --title "Task #$AGENT_TASK_ID: Codex change" \
            --body-file "$RUNNER_TEMP/agent-pr-body.md")
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Validate fast branch and publish main
        if: >-
          env.AGENT_MODE == 'fast' && env.FAST_FALLBACK == 'false'
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
          AGENT_CALLBACK_TOKEN: ${{ secrets.AGENT_CALLBACK_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" && test -n "$AGENT_CALLBACK_TOKEN"
          git show "$GITHUB_SHA:scripts/agent_task.py" > "$RUNNER_TEMP/agent_task.py"
          git show "$GITHUB_SHA:scripts/fast_publish.py" > "$RUNNER_TEMP/fast_publish.py"
          PYTHONPATH="$RUNNER_TEMP" python3 "$RUNNER_TEMP/fast_publish.py"

      - name: Report result to Task Manager
        if: always()
        env:
          AGENT_CALLBACK_TOKEN: ${{ secrets.AGENT_CALLBACK_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          FAILURE_PHASE: publish
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          HEAD_SHA: ${{ steps.branch.outputs.head_sha }}
        run: |
          set -euo pipefail
          test -n "$AGENT_CALLBACK_TOKEN"
          git show "$GITHUB_SHA:scripts/agent_task.py" > "$RUNNER_TEMP/agent-validator.py"
          python3 "$RUNNER_TEMP/agent-validator.py" callback
