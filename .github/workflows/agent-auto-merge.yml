name: Auto-merge small changes

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check current PR and the small-change policy
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/auto_merge.py
      - name: Merge the exact reviewed commit
        if: steps.policy.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
          PR_NUMBER: ${{ steps.policy.outputs.number }}
          HEAD_SHA: ${{ steps.policy.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --squash --match-head-commit "$HEAD_SHA"
