name: Agent run release actions

on:
  repository_dispatch:
    types: [agent_run_merge, agent_run_correction]

concurrency:
  group: agent-release-${{ github.event.client_payload.run_id }}
  cancel-in-progress: false

jobs:
  merge:
    if: github.event.action == 'agent_run_merge'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify owner request and exact release gate
        id: verify
        env:
          GH_TOKEN: ${{ vars.AGENT_QA_ENABLED == 'true' && github.event.client_payload.repo_full_name == vars.AGENT_QA_REPOSITORY && secrets.AGENT_QA_REPO_TOKEN || github.event.client_payload.repo_full_name == github.repository && secrets.AGENT_REPO_TOKEN || secrets.AGENT_PUBLIC_REPO_TOKEN }}
          AGENT_CALLBACK_TOKEN: ${{ secrets.AGENT_CALLBACK_TOKEN }}
          AGENT_QA_ENABLED: ${{ vars.AGENT_QA_ENABLED }}
          AGENT_QA_REPOSITORY: ${{ vars.AGENT_QA_REPOSITORY }}
        run: python3 scripts/agent_release.py verify-merge
      - name: Merge the exact current PR head
        if: steps.verify.outcome == 'success'
        env:
          GH_TOKEN: ${{ vars.AGENT_QA_ENABLED == 'true' && github.event.client_payload.repo_full_name == vars.AGENT_QA_REPOSITORY && secrets.AGENT_QA_REPO_TOKEN || github.event.client_payload.repo_full_name == github.repository && secrets.AGENT_REPO_TOKEN || secrets.AGENT_PUBLIC_REPO_TOKEN }}
          AGENT_QA_ENABLED: ${{ vars.AGENT_QA_ENABLED }}
          AGENT_QA_REPOSITORY: ${{ vars.AGENT_QA_REPOSITORY }}
          TARGET_REPO: ${{ github.event.client_payload.repo_full_name }}
          PR_NUMBER: ${{ steps.verify.outputs.pull_number }}
          EXPECTED_HEAD_SHA: ${{ steps.verify.outputs.head_sha }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh pr merge "$PR_NUMBER" --repo "$TARGET_REPO" \
            --squash --match-head-commit "$EXPECTED_HEAD_SHA"
      - name: Record exact merge result or rejection
        if: always()
        env:
          GH_TOKEN: ${{ vars.AGENT_QA_ENABLED == 'true' && github.event.client_payload.repo_full_name == vars.AGENT_QA_REPOSITORY && secrets.AGENT_QA_REPO_TOKEN || github.event.client_payload.repo_full_name == github.repository && secrets.AGENT_REPO_TOKEN || secrets.AGENT_PUBLIC_REPO_TOKEN }}
          AGENT_CALLBACK_TOKEN: ${{ secrets.AGENT_CALLBACK_TOKEN }}
          AGENT_QA_ENABLED: ${{ vars.AGENT_QA_ENABLED }}
          AGENT_QA_REPOSITORY: ${{ vars.AGENT_QA_REPOSITORY }}
          AGENT_QA_DEPLOY_WORKFLOW: ${{ vars.AGENT_QA_DEPLOY_WORKFLOW }}
        run: python3 scripts/agent_release.py report-merge

  correction:
    if: github.event.action == 'agent_run_correction'
    runs-on: [self-hosted, linux, x64, codex-agent]
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      branch: ${{ steps.verify.outputs.branch }}
      expected_head_sha: ${{ steps.verify.outputs.expected_head_sha }}
      run_id: ${{ steps.verify.outputs.run_id }}
      pr_number: ${{ steps.verify.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Preserve trusted correction validator
        run: git show "$GITHUB_SHA:scripts/agent_release.py" > "$RUNNER_TEMP/agent-release.py"
      - name: Verify owner request and exact current PR head
        id: verify
        env:
          GH_TOKEN: ${{ vars.AGENT_QA_ENABLED == 'true' && github.event.client_payload.repo_full_name == vars.AGENT_QA_REPOSITORY && secrets.AGENT_QA_REPO_TOKEN || github.event.client_payload.repo_full_name == github.repository && secrets.AGENT_REPO_TOKEN || secrets.AGENT_PUBLIC_REPO_TOKEN }}
          AGENT_CALLBACK_TOKEN: ${{ secrets.AGENT_CALLBACK_TOKEN }}
          AGENT_QA_ENABLED: ${{ vars.AGENT_QA_ENABLED }}
          AGENT_QA_REPOSITORY: ${{ vars.AGENT_QA_REPOSITORY }}
        run: python3 "$RUNNER_TEMP/agent-release.py" verify-correction
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repo_full_name }}
          ref: ${{ github.event.client_payload.expected_head_sha }}
          token: ${{ vars.AGENT_QA_ENABLED == 'true' && github.event.client_payload.repo_full_name == vars.AGENT_QA_REPOSITORY && secrets.AGENT_QA_READ_TOKEN || github.event.client_payload.repo_full_name == github.repository && secrets.AGENT_REPO_TOKEN || secrets.AGENT_PUBLIC_REPO_TOKEN }}
          persist-credentials: false
          clean: true
      - name: Apply owner correction with Codex
        run: |
          set -euo pipefail
          codex exec --sandbox workspace-write -c approval_policy=never \
            -c model_reasoning_effort=medium --model gpt-6-sol --ephemeral --json \
            --output-last-message "$RUNNER_TEMP/agent-correction-result.txt" \
            - < "$RUNNER_TEMP/agent-correction-prompt.txt" \
            > "$RUNNER_TEMP/agent-correction-events.jsonl"
      - name: Package correction patch
        run: |
          set -euo pipefail
          # Checkout of the requested SHA is credential-free. Package untracked
          # additions explicitly alongside the tracked diff.
          git add -N -A
          git diff --no-ext-diff --no-textconv --binary HEAD \
            > "$RUNNER_TEMP/agent-correction.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-correction
          path: |
            ${{ runner.temp }}/agent-correction.patch
            ${{ runner.temp }}/agent-correction-target.json
          if-no-files-found: error
          retention-days: 1
      - name: Remove correction prompt and result
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/agent-correction-prompt.txt" \
            "$RUNNER_TEMP/agent-correction-result.txt" \
            "$RUNNER_TEMP/agent-correction-events.jsonl"
      - name: Reject action if Codex correction failed
        if: failure()
        env:
          AGENT_CALLBACK_TOKEN: ${{ secrets.AGENT_CALLBACK_TOKEN }}
          AGENT_QA_ENABLED: ${{ vars.AGENT_QA_ENABLED }}
          AGENT_QA_REPOSITORY: ${{ vars.AGENT_QA_REPOSITORY }}
        run: python3 "$RUNNER_TEMP/agent-release.py" reject-action

  publish-correction:
    needs: correction
    if: always() && needs.correction.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - name: Preserve trusted publisher tools
        run: |
          git show "$GITHUB_SHA:scripts/agent_release.py" > "$RUNNER_TEMP/agent-release.py"
          git show "$GITHUB_SHA:scripts/agent_task.py" > "$RUNNER_TEMP/agent-validator.py"
          git show "$GITHUB_SHA:scripts/agent_preflight.py" > "$RUNNER_TEMP/agent-preflight.py"
      - uses: actions/download-artifact@v4
        with:
          name: agent-correction
          path: ${{ runner.temp }}
      - name: Fetch the exact PR head and enable write token for git push
        env:
          GH_TOKEN: ${{ vars.AGENT_QA_ENABLED == 'true' && github.event.client_payload.repo_full_name == vars.AGENT_QA_REPOSITORY && secrets.AGENT_QA_REPO_TOKEN || github.event.client_payload.repo_full_name == github.repository && secrets.AGENT_REPO_TOKEN || secrets.AGENT_PUBLIC_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
      - name: Publish only as a fast-forward PR update
        id: publish
        env:
          GH_TOKEN: ${{ vars.AGENT_QA_ENABLED == 'true' && github.event.client_payload.repo_full_name == vars.AGENT_QA_REPOSITORY && secrets.AGENT_QA_REPO_TOKEN || github.event.client_payload.repo_full_name == github.repository && secrets.AGENT_REPO_TOKEN || secrets.AGENT_PUBLIC_REPO_TOKEN }}
          DISPATCH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
          AGENT_QA_ENABLED: ${{ vars.AGENT_QA_ENABLED }}
          AGENT_QA_REPOSITORY: ${{ vars.AGENT_QA_REPOSITORY }}
          AGENT_CALLBACK_TOKEN: ${{ secrets.AGENT_CALLBACK_TOKEN }}
        run: python3 "$RUNNER_TEMP/agent-release.py" publish-correction
      - name: Reject action if trusted publication failed
        if: failure()
        env:
          AGENT_CALLBACK_TOKEN: ${{ secrets.AGENT_CALLBACK_TOKEN }}
          AGENT_QA_ENABLED: ${{ vars.AGENT_QA_ENABLED }}
          AGENT_QA_REPOSITORY: ${{ vars.AGENT_QA_REPOSITORY }}
        run: python3 "$RUNNER_TEMP/agent-release.py" reject-action
