name: Agent run release actions

on:
  repository_dispatch:
    types: [agent_run_merge]

concurrency:
  group: agent-release-${{ github.event.client_payload.run_id }}
  cancel-in-progress: false

jobs:
  merge:
    if: github.event.action == 'agent_run_merge'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify owner request and exact release gate
        id: verify
        env:
          GH_TOKEN: ${{ vars.AGENT_QA_ENABLED == 'true' && github.event.client_payload.repo_full_name == vars.AGENT_QA_REPOSITORY && secrets.AGENT_QA_REPO_TOKEN || github.event.client_payload.repo_full_name == github.repository && secrets.AGENT_REPO_TOKEN || secrets.AGENT_PUBLIC_REPO_TOKEN }}
          AGENT_CALLBACK_TOKEN: ${{ secrets.AGENT_CALLBACK_TOKEN }}
          AGENT_QA_ENABLED: ${{ vars.AGENT_QA_ENABLED }}
          AGENT_QA_REPOSITORY: ${{ vars.AGENT_QA_REPOSITORY }}
        run: python3 scripts/agent_release.py verify-merge
      - name: Merge the exact current PR head
        if: steps.verify.outcome == 'success' && steps.verify.outputs.already_merged != 'true'
        env:
          GH_TOKEN: ${{ vars.AGENT_QA_ENABLED == 'true' && github.event.client_payload.repo_full_name == vars.AGENT_QA_REPOSITORY && secrets.AGENT_QA_REPO_TOKEN || github.event.client_payload.repo_full_name == github.repository && secrets.AGENT_REPO_TOKEN || secrets.AGENT_PUBLIC_REPO_TOKEN }}
          AGENT_QA_ENABLED: ${{ vars.AGENT_QA_ENABLED }}
          AGENT_QA_REPOSITORY: ${{ vars.AGENT_QA_REPOSITORY }}
          TARGET_REPO: ${{ github.event.client_payload.repo_full_name }}
          PR_NUMBER: ${{ steps.verify.outputs.pull_number }}
          EXPECTED_HEAD_SHA: ${{ steps.verify.outputs.head_sha }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh pr merge "$PR_NUMBER" --repo "$TARGET_REPO" \
            --merge --match-head-commit "$EXPECTED_HEAD_SHA"
      - name: Record exact merge result or rejection
        if: always()
        env:
          GH_TOKEN: ${{ vars.AGENT_QA_ENABLED == 'true' && github.event.client_payload.repo_full_name == vars.AGENT_QA_REPOSITORY && secrets.AGENT_QA_REPO_TOKEN || github.event.client_payload.repo_full_name == github.repository && secrets.AGENT_REPO_TOKEN || secrets.AGENT_PUBLIC_REPO_TOKEN }}
          AGENT_CALLBACK_TOKEN: ${{ secrets.AGENT_CALLBACK_TOKEN }}
          AGENT_QA_ENABLED: ${{ vars.AGENT_QA_ENABLED }}
          AGENT_QA_REPOSITORY: ${{ vars.AGENT_QA_REPOSITORY }}
          AGENT_QA_DEPLOY_WORKFLOW: ${{ vars.AGENT_QA_DEPLOY_WORKFLOW }}
        run: python3 scripts/agent_release.py report-merge
