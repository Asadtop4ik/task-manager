# Pinned Codex CLI tarballs (main package + the linux-x64 native package it needs
# as an optionalDependency), downloaded fresh by the installer and verified against
# these npm-registry sha512 integrity values before `npm install --global` ever
# touches them.
#
# `@openai/codex` ships as a thin `bin/codex.js` launcher plus a per-platform
# optionalDependency package carrying the actual native binary + bundled ripgrep
# and bubblewrap resources (`@openai/codex-linux-x64`, published under the name
# `@openai/codex` at version `<CODEX_VERSION>-linux-x64` and consumed via npm's
# `name@npm:spec` alias). Because we install from local tarball files rather than
# resolving from the registry, the installer must supply that alias explicitly
# (`@openai/codex-linux-x64@file:<tarball>`) or npm would try to place the native
# package under the same directory as the main package (both declare the same
# internal "name": "@openai/codex").
#
# Regenerate for a new pinned version:
#   npm view @openai/codex@<version> dist.tarball dist.integrity
#   npm view "@openai/codex@<version>-linux-x64" dist.tarball dist.integrity
CODEX_VERSION=0.156.1

CODEX_MAIN_NAME=@openai/codex
CODEX_MAIN_TARBALL_NAME=codex-0.156.1.tgz
CODEX_MAIN_TARBALL_URL=https://registry.npmjs.org/@openai/codex/-/codex-0.156.1.tgz
CODEX_MAIN_INTEGRITY=sha512-nI1iVl/n2SO2lSvlwEsJx63zdSI4C4Me2gR7AG0OWMJiGSakz2tY2hx43E39Zq5aEoeB5bZjJXzp5Sqhog6vyA==

CODEX_LINUX_X64_ALIAS=@openai/codex-linux-x64
CODEX_LINUX_X64_VERSION=0.156.1-linux-x64
CODEX_LINUX_X64_TARBALL_NAME=codex-0.156.1-linux-x64.tgz
CODEX_LINUX_X64_TARBALL_URL=https://registry.npmjs.org/@openai/codex/-/codex-0.156.1-linux-x64.tgz
CODEX_LINUX_X64_INTEGRITY=sha512-2ePo0wgOcnONKsuzp8vBjOmNY+IdsKaouaDDIdiKq9HOWNuV/GI22OeXft2A/1GaoL71ictO0/pLAsCEnQ6wew==
