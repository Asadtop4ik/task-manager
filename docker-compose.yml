# Local development only. Production runs from deploy/stacks/task-manager.yml on
# the shared Postgres/Redis/Caddy — see PLAN.md §7.
name: task-manager

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskmgr
      POSTGRES_PASSWORD: taskmgr
      POSTGRES_DB: taskmgr
    # Host ports are shifted off the defaults on purpose: this machine already
    # runs a Postgres on 5432 and a Redis on 6379 for the other projects.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # Postgres 18 keeps data in a version subdirectory (/var/lib/postgresql/18/docker);
      # mounting the old /var/lib/postgresql/data path makes the entrypoint refuse to
      # start. Same mount the production infra compose uses.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmgr -d taskmgr"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Same policy as production: this holds FSM state and the arq queue, and
    # evicting either loses work a person actually did.
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  task-api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://taskmgr:taskmgr@postgres:5432/taskmgr
      DATABASE_URL_SYNC: postgresql+psycopg://taskmgr:taskmgr@postgres:5432/taskmgr
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["api"]

  task-bot:
    build: ./bot
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      API_BASE_URL: http://task-api:8000
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      redis: { condition: service_healthy }
    command: ["bot"]
    # Needs a BOT_TOKEN to be useful; start it explicitly with
    # `docker compose --profile bot up`.
    profiles: ["bot"]

  task-worker:
    build: ./bot
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      API_BASE_URL: http://task-api:8000
    depends_on:
      redis: { condition: service_healthy }
    command: ["worker"]
    profiles: ["bot"]

  task-frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - task-api

volumes:
  pgdata:
  redisdata:
