server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving the upstream at request time rather than at
    # startup means nginx still boots when task-api is down or restarting, instead
    # of dying with "host not found in upstream" and taking the SPA with it.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # In production Caddy routes /api/* and /ready straight to task-api and these
    # blocks are never reached. They exist so local `docker compose up` behaves
    # identically to production from one origin.
    location /api/ {
        set $api_upstream task-api:8000;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ready {
        set $ready_upstream task-api:8000;
        proxy_pass http://$ready_upstream;
        proxy_set_header Host $host;
    }

    # Vite fingerprints these filenames, so a year is safe; index.html is not
    # fingerprinted and must never be cached or a deploy ships a stale shell.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
